name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o finporto.zip -d extracted_project
        if [ $(ls -1 extracted_project | wc -l) -eq 1 ] && [ -d "extracted_project/$(ls extracted_project)" ]; then
          echo "Mendeteksi subfolder, memindahkan file..."
          mv extracted_project/$(ls extracted_project)/* .
          mv extracted_project/$(ls extracted_project)/.* . 2>/dev/null || true
        else
          mv extracted_project/* .
          mv extracted_project/.* . 2>/dev/null || true
        fi
        rm -rf extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: |
        GRADLEW_PATH=$(find . -name gradlew)
        if [ -n "$GRADLEW_PATH" ]; then
          chmod +x "$GRADLEW_PATH"
          echo "gradlew ditemukan di: $GRADLEW_PATH"
        else
          echo "Error: gradlew tetap tidak ditemukan!"
          exit 1
        fi

    - name: Build Debug APK
      run: |
        GRADLEW_PATH=$(find . -name gradlew)
        GRADLEW_DIR=$(dirname "$GRADLEW_PATH")
        cd "$GRADLEW_DIR"
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finporto-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
