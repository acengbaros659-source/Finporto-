name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip and Restructure Project
      run: |
        unzip -o finporto.zip -d extracted_project
        # Deteksi di mana letak file settings.gradle.kts berada
        SETTINGS_PATH=$(find extracted_project -name "settings.gradle*" | head -n 1)
        if [ -n "$SETTINGS_PATH" ]; then
          PROJ_DIR=$(dirname "$SETTINGS_PATH")
          echo "Memindahkan seluruh isi proyek dari $PROJ_DIR ke folder utama..."
          cp -r "$PROJ_DIR"/* . 2>/dev/null || true
          cp -r "$PROJ_DIR"/.* . 2>/dev/null || true
        else
          cp -r extracted_project/* . 2>/dev/null || true
        fi
        rm -rf extracted_project
        
        # Memastikan folder gradle bawaan zip benar-benar ada di direktori utama
        if [ -d "app/gradle" ] && [ ! -d "gradle" ]; then
          mv app/gradle ./
        fi

    - name: Fix Missing Greeting Component
      run: |
        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/src/main/java/com/example/Greeting.kt
        package com.example
        import androidx.compose.material3.Text
        import androidx.compose.runtime.Composable
        @Composable
        fun Greeting(name: String) {
            Text(text = "Hello $name")
        }
        EOF

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7

    - name: Build Production Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finporto-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
