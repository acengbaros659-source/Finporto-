name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o finporto.zip -d .

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Grant Execute Permission for Gradle
      run: |
        if [ -f "./gradlew" ]; then
          chmod +x gradlew
        else
          cd $(find . -maxdepth 2 -name gradlew -exec dirname {} \;)
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        if [ -f "./gradlew" ]; then
          ./gradlew assembleDebug
        else
          cd $(find . -maxdepth 2 -name gradlew -exec dirname {} \;)
          ./gradlew assembleDebug
        fi

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finporto-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
