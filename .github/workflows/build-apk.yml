name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o finporto.zip -d extracted_project
        # Cari di mana letak file build.gradle berada
        BG_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
        if [ -n "$BG_PATH" ]; then
          BG_DIR=$(dirname "$BG_PATH")
          echo "Proyek Android ditemukan di folder: $BG_DIR"
          mv "$BG_DIR"/* .
          mv "$BG_DIR"/.* . 2>/dev/null || true
        else
          mv extracted_project/* . 2>/dev/null || true
        fi
        rm -rf extracted_project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Generate Missing Gradle Wrapper
      run: |
        # Mengunduh dan membuat file gradlew baru jika hilang
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finporto-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
