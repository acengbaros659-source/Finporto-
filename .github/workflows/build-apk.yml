name: Build Android APK from Zip

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Unzip Source Code
      run: |
        unzip -o finporto.zip -d extracted_project
        BG_PATH=$(find extracted_project -name "build.gradle*" | head -n 1)
        if [ -n "$BG_PATH" ]; then
          BG_DIR=$(dirname "$BG_PATH")
          echo "Proyek Android ditemukan di folder: $BG_DIR"
          mv "$BG_DIR"/* .
          mv "$BG_DIR"/.* . 2>/dev/null || true
        else
          mv extracted_project/* . 2>/dev/null || true
        fi
        rm -rf extracted_project

    - name: Fix Missing Greeting Component (Anti-Error Build)
      run: |
        # Membuat file Greeting dummy agar pengujian screenshot tidak memicu crash saat kompilasi
        mkdir -p app/src/main/java/com/example
        cat << 'EOF' > app/src/main/java/com/example/Greeting.kt
        package com.example
        import androidx.compose.material3.Text
        import androidx.compose.runtime.Composable
        @Composable
        fun Greeting(name: String) {
            Text(text = "Hello $name")
        }
        EOF
        echo "Komponen Greeting tiruan sukses dibuat untuk mengamankan proses kompilasi!"

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Setup Gradle Build Environment
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: 8.7 # Versi stabil yang mendukung katalog versi toml Anda

    - name: Force Generate Wrapper Compatibility
      run: |
        gradle wrapper
        chmod +x gradlew

    - name: Build Production Debug APK
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: finporto-debug-apk
        path: "**/build/outputs/apk/debug/app-debug.apk"
        
